server:
  port: 8085

spring:
  application:
    name: typeverse

  datasource:
    url: jdbc:postgresql://localhost:5432/typingrace
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true